<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الحجوزات | Fun Center</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="brand">FUN <span>CENTER</span></div><a class="admin-link" href="index.html">الموقع</a></header><main class="section"><div class="section-head"><p class="eyebrow">Dashboard</p><h2>لوحة الحجوزات</h2></div><div id="stats" class="grid three"></div><div class="card" style="margin-top:20px;overflow:auto"><table id="table" style="width:100%;border-collapse:collapse"><thead><tr><th>الكود</th><th>الاسم</th><th>الجوال</th><th>التاريخ</th><th>الأشخاص</th><th>الباقة</th><th>الحالة</th></tr></thead><tbody></tbody></table></div></main><script>const data=JSON.parse(localStorage.getItem('funCenterBookings')||'[]');document.getElementById('stats').innerHTML=[['إجمالي الحجوزات',data.length],['الحجوزات الجديدة',data.filter(x=>x.status==='new').length],['إجمالي الأشخاص',data.reduce((a,x)=>a+Number(x.people_count||0),0)]].map(x=>`<div class="card"><p>${x[0]}</p><h2>${x[1]}</h2></div>`).join('');document.querySelector('tbody').innerHTML=data.slice().reverse().map(x=>`<tr>${[x.code,x.customer_name,x.phone,x.visit_date,x.people_count,x.offer,x.status].map(v=>`<td style="padding:14px;border-top:1px solid #293451">${v||''}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="7" style="padding:30px;text-align:center;color:#8893aa">لا توجد حجوزات بعد</td></tr>';</script></body></html>
